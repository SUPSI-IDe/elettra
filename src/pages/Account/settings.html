<section class="form-page settings-page">
  <header class="page-header">
    <div class="title-container">
      <h1 data-i18n="settings.title">Account settings</h1>
      <p class="intro" data-i18n="settings.intro">
        Update your account details and password here.
      </p>
    </div>
  </header>

  <main class="settings-content">
    <section class="settings-card" aria-labelledby="settings-profile-title">
      <div class="settings-card-header">
        <h2 id="settings-profile-title" data-i18n="settings.profile_title">Profile</h2>
        <p data-i18n="settings.profile_intro">Update your name and email address.</p>
      </div>

      <form data-form="profile-settings" novalidate>
        <p
          class="form-feedback"
          data-role="profile-feedback"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <div class="settings-grid">
          <div class="form-group">
            <label for="settings-name" data-i18n="settings.name">Name</label>
            <input
              type="text"
              id="settings-name"
              name="full_name"
              required
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <label for="settings-email" data-i18n="settings.email">Email</label>
            <input
              type="email"
              id="settings-email"
              name="email"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group settings-field-full">
            <label for="settings-agency" data-i18n="settings.agency">Agency</label>
            <input
              type="text"
              id="settings-agency"
              name="agency"
              autocomplete="off"
              readonly
              disabled
            />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" data-i18n="settings.profile_submit">Save profile</button>
        </div>
      </form>
    </section>

    <section class="settings-card" aria-labelledby="settings-password-title">
      <div class="settings-card-header">
        <h2 id="settings-password-title" data-i18n="settings.password_title">Password</h2>
        <p data-i18n="settings.password_intro">
          Choose a new password and confirm it before saving.
        </p>
      </div>

      <form data-form="password-settings" novalidate>
        <p
          class="form-feedback"
          data-role="password-feedback"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <div class="settings-grid">
          <div class="form-group settings-field-full">
            <label for="settings-current-password" data-i18n="password.current">Current Password</label>
            <input
              type="password"
              id="settings-current-password"
              name="current_password"
              required
              autocomplete="current-password"
            />
          </div>

          <div class="form-group">
            <label for="settings-new-password" data-i18n="password.new">New Password</label>
            <input
              type="password"
              id="settings-new-password"
              name="new_password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label for="settings-confirm-password" data-i18n="password.confirm">Confirm New Password</label>
            <input
              type="password"
              id="settings-confirm-password"
              name="confirm_password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" data-i18n="settings.password_submit">Update password</button>
        </div>
      </form>
    </section>
  </main>
</section>
