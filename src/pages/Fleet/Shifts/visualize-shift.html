<section class="visualize-shift" aria-labelledby="visualize-shift-heading">
  <header class="visualize-shift__header header-with-close page-header">
    <h1 id="visualize-shift-heading" class="page-title visualize-shift__title">
      <span data-i18n="shifts.visualize_title">Visualize vehicle block</span>
      <span class="visualize-shift__title-name" data-field="heading-name"></span>
    </h1>
    <button
      type="button"
      data-action="close"
      class="close-button"
      aria-label="Close"
      data-i18n-aria-label="common.close"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>

    </button>
  </header>
  <main>
    <section class="shift-general-info shift-summary__card" aria-labelledby="shift-general-info-heading">
      <header class="shift-general-info__header">
        <h2 id="shift-general-info-heading" data-i18n="shifts.information_heading">Information</h2>
      </header>
      <table class="shift-general-info__table">
        <caption class="sr-only" data-i18n="shifts.general_information_caption">
          General vehicle block and GTFS information
        </caption>
        <colgroup>
          <col class="shift-general-info__label-column" />
          <col class="shift-general-info__value-column" />
          <col class="shift-general-info__label-column" />
          <col class="shift-general-info__value-column" />
        </colgroup>
        <tbody>
          <tr>
            <th scope="row" data-i18n="shifts.field_shift_name">Vehicle block name</th>
            <td data-field="name">—</td>
            <th scope="row" data-i18n="shifts.bus_model_label">Bus model:</th>
            <td data-field="bus-name">—</td>
          </tr>
          <tr>
            <th scope="row" data-i18n="shifts.start_heading">Start</th>
            <td data-field="start-summary">—</td>
            <th scope="row" data-i18n="shifts.return_heading">Return</th>
            <td data-field="end-summary">—</td>
          </tr>
          <tr>
            <th scope="row" data-i18n="shifts.daily_distance_label">Daily distance:</th>
            <td data-field="daily-distance">—</td>
            <th scope="row" data-i18n="gtfs.label">GTFS timetable</th>
            <td data-role="shift-gtfs-summary"></td>
          </tr>
        </tbody>
      </table>
    </section>
    <div class="visualize-shift-grid">
      <section
        class="shift-visualization shift-summary__card"
        aria-label="Vehicle block view"
        data-i18n-aria-label="shifts.visualization_heading"
      >
        <header class="shift-visualization__header">
          <div class="shift-visualization__title-row">
            <div class="shift-view-controls">
              <div
                class="shift-view-toggle"
                role="group"
                aria-label="Visualization type"
                data-i18n-aria-label="shifts.view_toggle_label"
              >
                <button
                  type="button"
                  class="shift-view-toggle__button is-active"
                  data-view="space-time"
                  aria-pressed="true"
                  data-i18n="shifts.view_space_time"
                >Space-time</button>
                <button
                  type="button"
                  class="shift-view-toggle__button"
                  data-view="map"
                  aria-pressed="false"
                  data-i18n="shifts.view_map"
                >Map</button>
              </div>
              <button
                type="button"
                class="info-icon shift-view-help"
                aria-label="Some vehicle blocks may contain gaps in their recorded movements. For example, if one trip ends at Stop A and the next starts at Stop B without a transfer between them, the charts show two separate segments. This reflects missing movement data, not a visualization error."
                data-i18n-aria-label="shifts.view_data_gaps_help"
                aria-describedby="shift-view-data-gaps-help"
              >i<span
                id="shift-view-data-gaps-help"
                class="info-tooltip"
                role="tooltip"
                data-i18n="shifts.view_data_gaps_help"
              >Some vehicle blocks may contain gaps in their recorded movements. For example, if one trip ends at Stop A and the next starts at Stop B without a transfer between them, the charts show two separate segments. This reflects missing movement data, not a visualization error.</span></button>
            </div>
          </div>
        </header>
        <div
          class="shift-trip-map"
          data-role="trip-map"
          aria-label="Trip map"
          data-i18n-aria-label="shifts.trip_map_label"
          hidden
        >
          <div class="shift-trip-map__toolbar">
            <div class="shift-trip-map__trip-copy" aria-live="polite">
              <span class="shift-trip-map__counter" data-role="trip-map-counter">Trip 0 of 0</span>
              <h3 data-role="trip-map-route">— → —</h3>
              <p data-role="trip-map-time">—</p>
            </div>
            <div class="shift-trip-map__navigation">
              <button
                type="button"
                data-action="first-trip"
                aria-label="First trip"
                data-i18n-aria-label="shifts.map_first_trip"
              >
                <span aria-hidden="true">⇤</span>
                <span data-i18n="shifts.map_first">First</span>
              </button>
              <button
                type="button"
                data-action="previous-trip"
                aria-label="Previous trip"
                data-i18n-aria-label="shifts.map_previous_trip"
              >
                <span aria-hidden="true">←</span>
                <span data-i18n="shifts.map_previous">Previous</span>
              </button>
              <button
                type="button"
                data-action="next-trip"
                aria-label="Next trip"
                data-i18n-aria-label="shifts.map_next_trip"
              >
                <span data-i18n="shifts.map_next">Next</span>
                <span aria-hidden="true">→</span>
              </button>
              <button
                type="button"
                data-action="last-trip"
                aria-label="Last trip"
                data-i18n-aria-label="shifts.map_last_trip"
              >
                <span data-i18n="shifts.map_last">Last</span>
                <span aria-hidden="true">⇥</span>
              </button>
            </div>
          </div>
          <div class="shift-trip-map__content">
            <div class="shift-trip-map__canvas-wrap">
              <div
                class="shift-trip-map__canvas"
                data-role="shift-trip-map-canvas"
                aria-label="Route and stops for the selected trip"
                data-i18n-aria-label="shifts.trip_map_canvas_label"
              ></div>
              <p class="shift-trip-map__status" data-role="trip-map-status" role="status"></p>
            </div>
            <aside class="shift-trip-map__stops-panel">
              <h3 data-i18n="shifts.map_stops_heading">Stops and times</h3>
              <ol class="shift-trip-map__stops" data-role="trip-map-stops"></ol>
            </aside>
          </div>
        </div>
        <div
          class="shift-space-time shift-space-time--empty"
          data-role="space-time"
          role="region"
          aria-label="Space-time diagrams"
          data-i18n-aria-label="shifts.space_time_label"
          aria-busy="true"
        >
          <div
            class="shift-space-time__empty-popup"
            role="status"
            aria-live="polite"
          >
            <header class="shift-space-time__popup-header">
              <h3 data-i18n="common.loading_data">Loading data</h3>
            </header>
            <div class="shift-space-time__popup-content">
              <span class="shift-space-time__loading-spinner" aria-hidden="true"></span>
              <p data-i18n="common.loading_in_progress">Loading in progress…</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</section>
