<section class="form-page shift-planner">
  <header class="page-header">
    <div class="header-with-close">
      <h1 class="page-title" data-role="title" data-i18n="shifts.add_shift">Add vehicle block</h1>
      <button type="button" data-action="close" class="close-button" aria-label="Close" data-i18n-aria-label="common.close">
        <img src="assets/xmark.svg" alt="" aria-hidden="true" />
      </button>
    </div>
  </header>
  <main>
    <form data-form="shift-planner" novalidate>
      <p class="form-feedback" data-role="feedback" role="alert" hidden></p>
      <fieldset class="planner-fields" data-role="editor" disabled>
        <div class="planner-grid">
          <div class="planner-column">
            <section class="panel-card planner-card" aria-labelledby="planner-setup-heading">
              <h2 id="planner-setup-heading" class="card-title" data-i18n="shifts.composer_setup">Set up</h2>
              <div class="planner-field-grid">
                <label for="planner-weekday">
                  <span data-i18n="shift_planner.weekday">Service day</span>
                  <select id="planner-weekday" data-field="weekday" required></select>
                </label>
                <label for="planner-dataset">
                  <span data-i18n="gtfs.label">GTFS timetable</span>
                  <select id="planner-dataset" data-field="dataset" aria-describedby="planner-dataset-summary" required></select>
                </label>
                <label for="planner-depot">
                  <span data-i18n="shift_planner.start_depot">Starting depot</span>
                  <select id="planner-depot" data-field="depot" required></select>
                </label>
                <label for="planner-start-time">
                  <span data-i18n="shift_planner.start_time">Depot departure</span>
                  <input id="planner-start-time" data-field="start-time" type="text" placeholder="HH:MM" autocomplete="off" aria-describedby="planner-time-help" required />
                </label>
              </div>
              <div id="planner-dataset-summary" data-role="dataset-summary"></div>
              <small id="planner-time-help" data-i18n="shift_planner.time_help">Use service-day times. For example, 25:10 is 01:10 the next day.</small>
            </section>
            <section class="panel-card planner-card" aria-labelledby="planner-next-heading">
              <h2 id="planner-next-heading" class="card-title" tabindex="-1" data-i18n="shift_planner.next_trip">Next activity</h2>
              <div aria-live="polite" class="planner-state">
                <strong data-i18n="shift_planner.current">Current vehicle state</strong>
                <p data-role="current-state"></p>
              </div>
              <div class="planner-row-actions" data-role="position" hidden>
                <p data-role="position-text"></p>
                <button type="button" class="list-secondary-action" data-action="back-to-end" data-i18n="shift_planner.back_to_end">Back to programme end</button>
              </div>
              <div data-role="next-activity" hidden>
                <div class="planner-row-actions">
                  <button type="button" class="list-secondary-action" data-action="choose-stay" data-i18n="shift_planner.add_stay">Add depot stay</button>
                  <button type="button" class="list-secondary-action" data-action="choose-return" data-i18n="shift_planner.close">Plan return to depot</button>
                </div>
                <section class="planner-draft" data-role="draft" aria-labelledby="planner-draft-heading" hidden></section>
                <div class="planner-field-grid planner-line-filters">
                  <label for="planner-line">
                    <span data-i18n="shifts.filter_line">Line</span>
                    <select id="planner-line" data-field="line"></select>
                  </label>
                </div>
                <label class="planner-terminus-filter" data-role="terminus-filter" hidden>
                  <input type="checkbox" data-field="include-other-termini">
                  <span data-i18n="shift_planner.include_other_termini">Include other termini</span>
                </label>
                <div data-role="catalog"></div>
              </div>
            </section>
          </div>
          <section class="panel-card planner-card" aria-labelledby="planner-programme-heading">
            <div class="planner-card-header">
              <h2 id="planner-programme-heading" class="card-title" data-i18n="shifts.composer_programme">Your working day</h2>
              <button type="button" class="list-secondary-action" data-action="undo" data-i18n="shifts.composer_undo" disabled>Undo last change</button>
            </div>
            <div data-role="programme"></div>
          </section>
        </div>
        <section class="panel-card planner-card planner-save" aria-labelledby="planner-save-heading">
          <h2 id="planner-save-heading" class="card-title" data-i18n="shifts.composer_review">Review &amp; save</h2>
          <div class="planner-field-grid">
            <label for="planner-name">
              <span data-i18n="shifts.field_shift_name">Vehicle block name</span>
              <input id="planner-name" data-field="name" required maxlength="200" autocomplete="off" />
            </label>
            <label for="planner-bus">
              <span data-i18n="shifts.field_bus_model">Bus model</span>
              <select id="planner-bus" data-field="bus" required></select>
            </label>
          </div>
          <div class="form-actions">
            <button type="button" data-action="cancel" data-i18n="common.cancel">Cancel</button>
            <p data-role="save-status" aria-live="polite"></p>
            <button type="submit" data-action="save" class="action-positive" data-i18n="shifts.save_shift">Save vehicle block</button>
          </div>
        </section>
      </fieldset>
    </form>
  </main>
</section>
