<section class="custom-stops">
  <header class="page-header">
    <div class="title-container">
      <h1 class="page-title" data-i18n="nav.custom_stops">Custom Stops</h1>
    </div>
  </header>
  <p
    class="flash-message"
    data-role="flash"
    role="status"
    aria-live="polite"
    hidden
  ></p>
  <main class="custom-stops-main">
    <div class="table-controls">
      <label for="custom-stops-filter" class="sr-only" data-i18n="custom_stops.filter_label"
        >Filter custom stops</label
      >
      <input
        id="custom-stops-filter"
        type="search"
        placeholder="Search stops"
        data-i18n-placeholder="custom_stops.search_placeholder"
      />
      <button
        type="button"
        class="list-primary-action"
        data-action="add-custom-stop"
        data-i18n="custom_stops.add_custom_stop"
      >
        Add Custom Stop
      </button>
      <div class="actions">
        <button
          type="button"
          class="list-danger-action requires-selection"
          data-action="delete-selected-stops"
          data-i18n="common.delete"
        >
          Delete
        </button>
      </div>
    </div>
    <div class="custom-stop-table">
      <table class="table-standard table-selectable">
        <thead>
          <tr>
            <th class="checkbox">
              <input
                type="checkbox"
                aria-label="Select all stops"
                data-i18n-aria-label="custom_stops.select_all"
              />
            </th>

            <th class="name" data-i18n="custom_stops.col_name">Name</th>
            <th class="type" data-i18n="custom_stops.col_type">Type</th>
            <th class="address" data-i18n="custom_stops.col_address">Address</th>
            <th class="actions" data-i18n="common.actions">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <dialog class="entity-details" data-role="custom-stop-details-dialog" aria-labelledby="custom-stop-details-title">
    <div class="entity-details__shell">
      <header class="entity-details__header">
        <h2 id="custom-stop-details-title" class="entity-details__title" data-role="entity-details-title"></h2>
      </header>
      <div class="entity-details__content" data-role="entity-details-content"></div>
      <footer class="entity-details__footer">
        <button type="button" class="btn-secondary" data-action="close-details" data-i18n="common.close">Close</button>
      </footer>
    </div>
  </dialog>
</section>
