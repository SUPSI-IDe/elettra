<section class="form-page add-bus-model">
  <header class="page-header">
    <div class="header-with-close">
      <h1 class="page-title" data-i18n="buses.add_model">Add bus model</h1>
      <button
        type="button"
        data-action="close"
        class="close-button"
        aria-label="Close"
        data-i18n-aria-label="common.close"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>
  <main class="bus-model-form-main">
    <form data-form="add-bus-model" novalidate>
      <p
        class="form-feedback"
        data-role="feedback"
        role="status"
        aria-live="polite"
        hidden
      ></p>
      <div class="bus-model-shell">
        <div class="bus-model-panels">
          <section class="bus-model-panel bus-model-panel--wide">
            <div class="bus-model-panel-header">
              <h3 class="card-title" data-i18n="buses.section_general_info">General information</h3>
            </div>
            <div class="bus-model-grid bus-model-grid--2">
              <div class="form-group">
                <label for="name"><span data-i18n="buses.model_name">Name</span> <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="text" id="name" name="name" required autocomplete="off" />
              </div>
              <div class="form-group">
                <div class="vehicle-category-label-row">
                  <label for="vehicle_reference_key"><span data-i18n="buses.vehicle_category">Vehicle category</span> <span class="required-mark" aria-hidden="true">*</span></label>
                  <button
                    type="button"
                    class="vehicle-category-info"
                    data-role="vehicle-category-info"
                    data-tooltip="Select a vehicle category to see its LCA reference."
                    aria-label="Select a vehicle category to see its LCA reference."
                  >
                    i
                  </button>
                </div>
                <select id="vehicle_reference_key" name="vehicle_reference_key" required>
                  <option value="" disabled selected data-i18n="buses.placeholder_vehicle_category">Select a vehicle category…</option>
                  <option value="midi_electric_bus_9m" data-i18n="buses.vehicle_category_midi_9m">Midi electric bus — 9 m</option>
                  <option value="standard_electric_bus_12_13m" data-i18n="buses.vehicle_category_standard_12_13m">Standard electric bus — 13 m</option>
                  <option value="articulated_electric_bus_18m" data-i18n="buses.vehicle_category_articulated_18m">Articulated electric bus — 18 m</option>
                </select>
              </div>
              <div class="form-group bus-model-field--full">
                <label for="description" data-i18n="buses.field_description">Description <span class="optional-note" data-i18n="common.optional">(optional)</span></label>
                <textarea
                  id="description"
                  name="description"
                  rows="4"
                  autocomplete="off"
                ></textarea>
              </div>
            </div>
          </section>

          <section class="bus-model-panel">
            <div class="bus-model-panel-header">
              <h3 class="card-title" data-i18n="buses.section_vehicle_specs">Vehicle specs</h3>
            </div>
            <div class="bus-model-grid">
              <div class="form-group">
                <label for="bus_length_m"><span data-i18n="buses.field_bus_length">Bus length (m)</span> <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="bus_length_m"
                  name="bus_length_m"
                  required
                  min="0.001"
                  step="any"
                  autocomplete="off"
                  readonly
                />
              </div>
              <div class="form-group">
                <div class="vehicle-category-label-row">
                  <label for="cost" data-i18n="buses.field_cost">Cost (CHF) <span class="required-mark" aria-hidden="true">*</span></label>
                  <button
                    type="button"
                    class="vehicle-category-info"
                    data-role="cost-info"
                    data-tooltip="Vehicle cost without batteries."
                    aria-label="Vehicle cost without batteries."
                  >
                    i
                  </button>
                </div>
                <input
                  type="number"
                  id="cost"
                  name="cost"
                  required
                  min="0"
                  step="any"
                  autocomplete="off"
                />
              </div>
              <div class="form-group">
                <label for="max_passengers" data-i18n="buses.field_passenger_capacity">Passenger capacity <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="max_passengers"
                  name="max_passengers"
                  required
                  min="1"
                  step="1"
                  autocomplete="off"
                />
              </div>
              <div class="form-group">
                <div class="vehicle-category-label-row">
                  <label for="empty_weight_kg" data-i18n="buses.field_empty_weight">Empty weight (kg) <span class="required-mark" aria-hidden="true">*</span></label>
                  <button
                    type="button"
                    class="vehicle-category-info"
                    data-role="empty-weight-info"
                    data-tooltip="Vehicle mass without battery packs or passengers."
                    aria-label="Vehicle mass without battery packs or passengers."
                  >
                    i
                  </button>
                </div>
                <input
                  type="number"
                  id="empty_weight_kg"
                  name="empty_weight_kg"
                  required
                  min="0.001"
                  step="1"
                  autocomplete="off"
                />
              </div>
              <div class="form-group bus-model-field--compact">
                <label for="bus_lifetime" data-i18n="buses.field_bus_lifetime">Bus lifetime (years) <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="bus_lifetime"
                  name="bus_lifetime"
                  required
                  min="1"
                  step="1"
                  autocomplete="off"
                />
              </div>
            </div>
          </section>

          <section class="bus-model-panel">
            <div class="bus-model-panel-header">
              <h3 class="card-title" data-i18n="buses.section_battery_system">Battery system</h3>
            </div>
            <div class="bus-model-grid">
              <div class="form-group">
                <label for="min_battery_packs" data-i18n="buses.field_min_battery_packs">Min battery packs <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="min_battery_packs"
                  name="min_battery_packs"
                  required
                  min="1"
                  step="1"
                  autocomplete="off"
                />
              </div>
              <div class="form-group">
                <label for="max_battery_packs" data-i18n="buses.field_max_battery_packs">Max battery packs <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="max_battery_packs"
                  name="max_battery_packs"
                  required
                  min="1"
                  step="1"
                  autocomplete="off"
                />
              </div>
              <div class="form-group">
                <label for="battery_pack_size_kwh" data-i18n="buses.field_battery_pack_size">Battery pack size (kWh) <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="battery_pack_size_kwh"
                  name="battery_pack_size_kwh"
                  required
                  min="0.001"
                  step="any"
                  autocomplete="off"
                />
              </div>
              <div class="form-group">
                <label for="battery_pack_cost_chf" data-i18n="buses.field_battery_pack_cost">Battery pack cost (CHF) <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="battery_pack_cost_chf"
                  name="battery_pack_cost_chf"
                  required
                  min="0"
                  step="any"
                  autocomplete="off"
                />
              </div>
              <div class="form-group">
                <label for="max_charging_power_kw" data-i18n="buses.field_max_charging_power">Max charging power (kW) <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="max_charging_power_kw"
                  name="max_charging_power_kw"
                  required
                  min="0.001"
                  step="any"
                  autocomplete="off"
                />
              </div>
              <div class="form-group">
                <label for="battery_pack_weight_kg" data-i18n="buses.field_battery_pack_weight">Battery pack weight (kg) <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="battery_pack_weight_kg"
                  name="battery_pack_weight_kg"
                  required
                  min="0.001"
                  step="any"
                  autocomplete="off"
                />
              </div>
              <div class="form-group bus-model-field--compact">
                <label for="battery_pack_lifetime" data-i18n="buses.field_battery_pack_lifetime">Battery pack lifetime (years) <span class="required-mark" aria-hidden="true">*</span></label>
                <input
                  type="number"
                  id="battery_pack_lifetime"
                  name="battery_pack_lifetime"
                  required
                  min="1"
                  step="1"
                  autocomplete="off"
                />
              </div>
            </div>
          </section>
        </div>

        <div class="bus-model-form-footer">
          <p class="required-note" data-i18n="buses.required_fields_note">* Indicates required fields</p>
          <div class="form-actions">
            <button type="button" data-action="cancel" data-i18n="common.cancel">Cancel</button>
            <button type="submit" data-i18n="common.save">Save</button>
          </div>
        </div>
      </div>
    </form>
  </main>
</section>
