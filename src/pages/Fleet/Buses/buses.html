<section class="buses">
  <header class="page-header">
    <div class="title-container">
      <h1 class="page-title" data-i18n="nav.buses">Bus Models</h1>
    </div>
  </header>
  <p
    class="flash-message"
    data-role="flash"
    role="status"
    aria-live="polite"
    hidden
  ></p>
  <main class="buses-content">
    <div class="table-controls">
      <input
        type="text"
        placeholder="Search models"
        data-i18n-placeholder="buses.search_placeholder"
      />
      <button
        type="button"
        class="list-primary-action"
        data-action="add-bus-model"
        data-i18n="buses.add_model"
      >
        Add Bus Model
      </button>
      <div class="actions">
        <button
          type="button"
          class="list-danger-action requires-selection"
          data-action="delete-selected-models"
          data-i18n="common.delete"
        >
          Delete
        </button>
      </div>
    </div>
    <section class="bus-models">
      <table class="table-standard table-selectable">
        <thead>
          <tr>
            <th class="checkbox">
              <input
                type="checkbox"
                aria-label="Select all bus models"
                data-i18n-aria-label="buses.select_all_models"
              />
            </th>
            <th class="name" data-i18n="buses.model_name">Name</th>
            <th class="model" data-i18n="buses.vehicle_category">Vehicle category</th>
            <th class="size" data-i18n="buses.model_size">Size [m]</th>
            <th class="actions" data-i18n="common.actions">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="bus-models-pagination" data-role="bus-models-pagination"></div>
    </section>
  </main>
  <dialog class="entity-details" data-role="bus-model-details-dialog" aria-labelledby="bus-model-details-title">
    <div class="entity-details__shell">
      <header class="entity-details__header">
        <h2 id="bus-model-details-title" class="entity-details__title" data-role="entity-details-title"></h2>
      </header>
      <div class="entity-details__content" data-role="entity-details-content"></div>
      <footer class="entity-details__footer">
        <button type="button" class="btn-secondary" data-action="close-details" data-i18n="common.close">Close</button>
      </footer>
    </div>
  </dialog>
</section>
