<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" defer src="/src/main.js"></script>
    <title>ELETTRA</title>
  </head>
  <body>
    <nav hidden>
      <div class="logo">
        <img src="assets/logo.svg" alt="ELETTRA Logo" data-i18n-alt="common.logo_alt" />
      </div>
      <ul class="nav-links">
        <li><a data-partial="buses" data-i18n="nav.buses">Buses</a></li>
        <li><a data-partial="custom-stops" data-i18n="nav.custom_stops">Custom Stops</a></li>
        <li><a data-partial="shifts" data-i18n="nav.shifts">Shifts</a></li>
        <li><a data-partial="simulation-runs" data-i18n="nav.my_simulations">Feasibility evaluation</a></li>
        <li><a data-partial="yearly-analysis-runs" data-i18n="nav.yearly_analyses">Yearly analyses</a></li>
      </ul>
    </nav>
    <main class="layout-main">
      <header class="layout-header blue-gray">
        <div class="header-spacer"></div>

        <div class="user-section">
          <button class="login" data-action="login" data-i18n="header.login">Login</button>
          <div class="user-menu" hidden>
            <div class="user-info">
              <svg class="user-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <div class="user-details">
                <span class="user-name" data-role="user-name"></span>
                <span class="user-separator">|</span>
                <span class="user-company" data-role="user-company"></span>
              </div>
            </div>
            <button class="user-menu-toggle" aria-expanded="false" aria-haspopup="true" aria-label="User menu" data-i18n-aria-label="common.user_menu">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M3 5L8 10L13 5" stroke="currentColor" stroke-width="1.5" fill="none"/>
              </svg>
            </button>
            <div class="user-menu-dropdown" hidden>
              <div class="dropdown-user-info">
                <span class="dropdown-email" data-role="user-email"></span>
              </div>
              <hr />
              <button data-action="account-settings" data-i18n="header.account_settings">Account Settings</button>
              <hr />
              <button data-action="logout" data-i18n="header.logout">Logout</button>
            </div>
          </div>
        </div>

        <div class="language-section">
          <svg class="language-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <select class="language-select" aria-label="Select language" data-i18n-aria-label="common.select_language">
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="fr">FR</option>
            <option value="it">IT</option>
          </select>
        </div>

        <button class="about-btn" data-partial="about" data-i18n-aria-label="header.about" data-i18n-title="header.about" aria-label="About" title="About">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </button>
      </header>
      <article class="layout-article"></article>
      <footer class="layout-footer blue-gray">
        <span class="impressum">
          ELETTRA |
          <a class="footer-about-link" data-partial="about" data-i18n="footer.about">About</a>
        </span>
        <a
          class="privacy-policy"
          href="https://www.supsi.ch/en/privacy-policy"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="footer.privacy_policy"
          >Privacy Policy</a
        >
      </footer>
    </main>
  </body>
</html>
